<html lang="es">
<head>

<meta name="theme-color" content="#727c71">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f3ec; --ink:#2f2a24; --muted:#7a7064; --accent:#727c71; --accent-dark:#5b6459; --gold:#b89a6a; --line:#e2d8c8; --paper:#fffdf9; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 300 17px/1.6 "Jost", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
    background: radial-gradient(ellipse at top, rgba(184,154,106,.16), transparent 60%),
                radial-gradient(ellipse at bottom, rgba(114,124,113,.18), transparent 60%), var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 1.5rem; min-height: 100svh;
  }
  .gate { width: 100%; max-width: 360px; text-align: center; }
  .eyebrow { font-size: .75rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); margin-bottom: .6rem; }
  h1 { font: italic 400 clamp(2.8rem, 14vw, 4rem)/1 "Cormorant Garamond", Georgia, serif; }
  h1 span { display: block; font-style: normal; font-size: .5em; color: var(--gold); margin: .2em 0; }
  .rule { display: flex; align-items: center; justify-content: center; gap: .8rem; margin: 1.6rem 0; color: var(--gold); }
  .rule i { width: 48px; height: 1px; background: currentColor; }
  .rule svg { width: 16px; height: 16px; fill: currentColor; }
  p.lead { color: var(--muted); margin-bottom: 1.2rem; }
  input {
    width: 100%; min-height: 54px; padding: .8rem 1rem; text-align: center;
    font: 400 18px/1 "Jost", sans-serif; letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    -webkit-appearance: none; appearance: none;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(114,124,113,.2); }
  input.bad { border-color: #c0675a; animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  button {
    width: 100%; min-height: 50px; margin-top: .8rem; cursor: pointer;
    font: 400 .85rem/1 "Jost", sans-serif; letter-spacing: .14em; text-transform: uppercase;
    color: #fff; background: var(--accent); border: 0; border-radius: 999px;
  }
  button:hover { background: var(--accent-dark); }
  button[disabled] { opacity: .6; }
  .err { color: #a4493d; font-size: .9rem; margin-top: .8rem; min-height: 1.4em; }
  noscript { display: block; margin-top: 1rem; color: var(--muted); }
</style>
</head>

  var KEY = "boda-codigo";
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var norm = function (s) { return (s || "").trim().toUpperCase(); };

  async function open(code) {
    var raw = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.s), iterations: P.n, hash: "SHA-256" },
      raw, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, key, b64(P.c));
    return new TextDecoder().decode(pt);
  }
  function show(html, code) {
    try { localStorage.setItem(KEY, code); } catch (e) {}
    var h = location.hash;
    if (h && norm(decodeURIComponent(h.slice(1))) === code) history.replaceState(null, "", location.pathname + location.search);
    try { history.scrollRestoration = "manual"; } catch (e) {}
    document.open(); document.write(html); document.close();
    window.scrollTo(0, 0);
  }
  async function attempt(code) {
    code = norm(code);
    if (!code) return false;
    try { show(await open(code), code); return true; } catch (e) { return false; }
  }

  var form = document.getElementById("f"), input = document.getElementById("code"),
      btn = document.getElementById("go"), err = document.getElementById("err");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    btn.disabled = true; btn.textContent = "Abriendo…"; err.textContent = "";
    if (!(await attempt(input.value))) {
      btn.disabled = false; btn.textContent = "Entrar";
      err.textContent = "Ese código no es correcto. Revisá tu invitación.";
      input.classList.remove("bad"); void input.offsetWidth; input.classList.add("bad"); input.focus();
    }
  });

  // Entrada automática: código recordado o link con #CODIGO
  (async function () {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    var fromHash = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
    if (fromHash && await attempt(fromHash)) return;
    if (saved && await attempt(saved)) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    input.focus();
  })();
